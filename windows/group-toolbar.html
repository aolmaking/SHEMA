<!doctype html>
<html lang="ar" dir="rtl" data-theme="glass">
<head>
  <meta charset="utf-8">
  <title>شريط التحكم بالمجموعة</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      background: transparent;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
    }

    .group-bar {
      width: 236px;
      height: 38px;
      background: rgba(24, 24, 30, 0.88);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 999px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255, 255, 255, 0.08) inset;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 6px 0 10px;
      color: #ffffff;
      animation: barPop 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes barPop {
      0% { opacity: 0; transform: scale(0.9) translateY(6px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    .group-info {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 700;
      color: var(--accent, #0099ff);
    }

    .group-pill {
      background: color-mix(in srgb, var(--accent, #0099ff) 22%, transparent);
      color: var(--accent, #0099ff);
      border: 1px solid color-mix(in srgb, var(--accent, #0099ff) 35%, transparent);
      padding: 2px 7px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 800;
    }

    .group-actions {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .group-btn {
      width: 27px;
      height: 27px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.06);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.15s ease;
    }

    .group-btn:hover {
      background: rgba(255, 255, 255, 0.18);
      border-color: rgba(255, 255, 255, 0.28);
      transform: scale(1.08);
    }

    .group-btn.danger:hover {
      background: rgba(239, 68, 68, 0.25);
      color: #ef4444;
      border-color: rgba(239, 68, 68, 0.45);
    }
  </style>
</head>
<body>
  <div class="group-bar" id="groupBar">
    <div class="group-info">
      <span id="groupBlockLabel">كتلة</span>
      <span class="group-pill" id="groupCount">عناصر محددة</span>
    </div>
    <div class="group-actions">
      <button type="button" class="group-btn" id="btnGrid" title="ترتيب كشبكة منتظمة ⊞">⊞</button>
      <button type="button" class="group-btn" id="btnRestore" title="استعادة الحجم الطبيعي للكل ⤢">⤢</button>
      <button type="button" class="group-btn danger" id="btnDismiss" title="إلغاء التحديد ✕">✕</button>
    </div>
  </div>

  <script>
    function applyGroupLang() {
      const isEn = (window.widgets?.settings?.get()?.language === 'en');
      document.documentElement.dir = isEn ? 'ltr' : 'rtl';
      document.documentElement.lang = isEn ? 'en' : 'ar';
      const lbl = document.getElementById('groupBlockLabel');
      if (lbl) lbl.textContent = isEn ? 'Block' : 'كتلة';
      const bG = document.getElementById('btnGrid');
      if (bG) bG.title = isEn ? 'Arrange as grid ⊞' : 'ترتيب كشبكة منتظمة ⊞';
      const bR = document.getElementById('btnRestore');
      if (bR) bR.title = isEn ? 'Restore all normal size ⤢' : 'استعادة الحجم الطبيعي للكل ⤢';
      const bD = document.getElementById('btnDismiss');
      if (bD) bD.title = isEn ? 'Deselect ✕' : 'إلغاء التحديد ✕';
    }
    applyGroupLang();

    if (window.widgets?.win?.onGroupUpdate) {
      window.widgets.win.onGroupUpdate(({ count, theme, accent }) => {
        applyGroupLang();
        const isEn = (window.widgets?.settings?.get()?.language === 'en');
        if (theme) document.documentElement.setAttribute('data-theme', theme);
        if (accent) document.documentElement.style.setProperty('--accent', accent);
        document.getElementById('groupCount').textContent = isEn ? `${count} items` : `${count} عناصر`;
      });
    }

    document.getElementById('btnGrid').addEventListener('click', () => {
      window.widgets?.group?.arrangeGrid?.();
    });

    document.getElementById('btnRestore').addEventListener('click', () => {
      window.widgets?.group?.restoreAll?.();
    });

    document.getElementById('btnDismiss').addEventListener('click', () => {
      window.widgets?.group?.dismiss?.();
    });
  </script>
</body>
</html>
