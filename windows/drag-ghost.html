<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'; img-src 'self' data:;">
  <title>Drag Ghost</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/widget-icons-3d.css">
  <link rel="stylesheet" href="css/folder.css">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent !important;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-user-select: none;
      pointer-events: none;
    }
    .desktop-drag-ghost {
      width: 44px;
      height: 44px;
      border-radius: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      transform: scale(1.1) rotate(-4deg);
      box-shadow:
        0 18px 38px rgba(0, 0, 0, 0.38),
        0 6px 14px rgba(0, 0, 0, 0.22),
        0 0 0 2.5px rgba(255, 255, 255, 0.9);
      will-change: transform;
    }
    .desktop-drag-ghost .folder-icon-art {
      width: 100%;
      height: 100%;
      border-radius: 11px;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="desktop-drag-ghost" id="ghostWrap"></div>
  <script src="js/shared-icon-art.js"></script>
  <script src="js/folder-art.js"></script>
  <script>
    if (window.widgets && window.widgets.folder && window.widgets.folder.onDragGhostSet) {
      window.widgets.folder.onDragGhostSet((data) => {
        const wrap = document.getElementById('ghostWrap');
        if (!wrap) return;
        wrap.innerHTML = '';
        if (data && data.wid && window.createFolderIconArt) {
          wrap.appendChild(window.createFolderIconArt(data.wid));
        }
      });
    }
  </script>
</body>
</html>
